<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaze Score</title>
<meta name="description" content="Ad-free live soccer scores, standings and match predictions.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1411">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<link rel="modulepreload" href="/lib/service.js">
<link rel="modulepreload" href="/lib/predict.js">
<link rel="modulepreload" href="/lib/demo.js">
<link rel="modulepreload" href="/lib/format.js">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 2c.6 3.6 5.5 5.6 5.5 11a6 6 0 0 1-12 0c0-2.3 1-3.8 2.3-5 .1 1.8.9 2.9 2.2 3.2C10 8.2 10.4 4.6 12.5 2z"/></svg><b>Blaze</b><span>Score</span></div>
    <div class="hright">
      <button class="pill bell" id="bell" type="button" aria-label="Goal alerts" title="Goal alerts for followed teams" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span>Alerts</span></button>
      <button class="iconbtn" id="theme" type="button" aria-label="Theme: follows your system" title="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></button>
      <button class="iconbtn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <button class="pill" id="mode" type="button" aria-label="Data source">Loading</button>
    </div>
  </header>
  <nav class="nav" aria-label="Main">
    <a href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Scores</a>
    <a href="#/predictions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Predictions</a>
    <a href="#/tips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Tips</a>
    <a href="#/tables"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M10 5v14"/></svg>Tables</a>
    <a href="#/picks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>My picks</a>
  </nav>
  <main id="view" tabindex="-1">
    <noscript><div class="card empty"><b>JavaScript is off</b><span>Blaze Score needs JavaScript to load scores. Turn it on and reload.</span></div></noscript>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
